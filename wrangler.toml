# ============================================================
# Robot Fragrances — checkout worker config
# ------------------------------------------------------------
# This lives at the REPO ROOT on purpose, even though the worker
# source is in worker/.
#
# Cloudflare Workers Builds runs `wrangler deploy` from the root
# by default. With no config here it found only HTML, assumed a
# static site, and deployed the storefront over the checkout API
# — taking checkout down. Keeping the config at the root means
# the default build settings do the right thing and there is no
# "Root directory" field to get wrong.
#
# Leave Root directory EMPTY in the Workers Builds settings.
# ============================================================

name = "robot-fragrances-checkout"
main = "worker/src/index.js"
compatibility_date = "2025-11-01"

# Runs before every bundle, including in Workers Builds. Stamps the
# commit into worker/src/version.js so /api/health can report which
# build is actually live.
[build]
command = "node scripts/stamp-version.js"

# Public config. Safe to commit — nothing here is a secret.
[vars]
SITE_URL = "https://robotfragrances.com"

# ALLOWED_ORIGINS is optional: a comma-separated list of extra
# origins allowed to call the API. SITE_URL, its www. variant and
# localhost are always allowed, so most setups can leave it unset.
# ALLOWED_ORIGINS = "https://staging.robotfragrances.com"

# MAILERLITE_GROUP_ID is optional: comma-separated MailerLite group
# IDs that newsletter sign-ups are filed into. Unset means they land
# in the account ungrouped. The ID is in the group's dashboard URL.
# MAILERLITE_GROUP_ID = "123456789"

# MAILERLITE_STATUS is optional and should almost always stay unset.
# It defaults to "unconfirmed", which is what makes MailerLite send
# its confirmation email — the check that stops a public form from
# putting someone on a list without their say-so. Setting "active"
# skips that. Don't, unless you know why you are.
# MAILERLITE_STATUS = "unconfirmed"

# ------------------------------------------------------------
# SECRETS — STRIPE_SECRET_KEY and MAILERLITE_API_KEY — must never
# live in this file or anywhere else in the repo. They are stored
# on the Worker itself, so they survive redeploys and are never
# part of a build. Set them with:
#
#     npx wrangler secret put STRIPE_SECRET_KEY
#     npx wrangler secret put MAILERLITE_API_KEY
#
# ...or in the dashboard under Settings -> Variables and Secrets.
# For local dev, use worker/.dev.vars (gitignored).
#
# Without MAILERLITE_API_KEY only /api/subscribe is affected: it
# answers 503 and checkout carries on as normal.
# ------------------------------------------------------------
